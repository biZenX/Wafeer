name: Release Wafeer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.WAFEER_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.WAFEER_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.WAFEER_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.WAFEER_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASS=""
          KEY_ALIAS=""
          KEY_PASS=""

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Attempting to use keystore from base64 secret..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > test-secret-keystore.jks
            for p in "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_PASSWORD" "WafeerRelease2026Key!"; do
              if [ -n "$p" ] && keytool -list -keystore test-secret-keystore.jks -storepass "$p" >/dev/null 2>&1; then
                mv test-secret-keystore.jks release-keystore.jks
                STORE_PASS="$p"
                KEY_ALIAS="${RELEASE_KEY_ALIAS:-wafeer}"
                KEY_PASS="${RELEASE_KEY_PASSWORD:-$p}"
                echo "Secret keystore validated successfully."
                break
              fi
            done
            rm -f test-secret-keystore.jks
          fi

          if [ ! -f "release-keystore.jks" ] && [ -f "config/signing/release.jks" ]; then
            echo "Using canonical release keystore from repository."
            cp config/signing/release.jks release-keystore.jks
            for p in "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_PASSWORD" "WafeerRelease2026Key!"; do
              if [ -n "$p" ] && keytool -list -keystore release-keystore.jks -storepass "$p" >/dev/null 2>&1; then
                STORE_PASS="$p"
                KEY_ALIAS="${RELEASE_KEY_ALIAS:-wafeer}"
                KEY_PASS="${RELEASE_KEY_PASSWORD:-$p}"
                if ! keytool -list -keystore release-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" >/dev/null 2>&1; then
                  KEY_ALIAS="wafeer"
                  KEY_PASS="$STORE_PASS"
                fi
                echo "Canonical release keystore validated successfully."
                break
              fi
            done
          fi

          if [ ! -f "release-keystore.jks" ] || [ -z "$STORE_PASS" ]; then
            echo "Generating fallback release keystore."
            STORE_PASS="WafeerRelease2026Key!"
            KEY_ALIAS="wafeer"
            KEY_PASS="WafeerRelease2026Key!"
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Wafeer, OU=Wafeer, O=Wafeer, L=Cairo, S=Cairo, C=EG"
          fi

          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release-keystore.jks
          storePassword=${STORE_PASS}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASS}
          EOF

          echo "RELEASE_STORE_FILE=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          echo "Verifying keystore access prior to build:"
          keytool -list -keystore release-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS"

      - name: Build Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          ./gradlew :app:assembleFossRelease --no-daemon --stacktrace
          ./gradlew :wear:assembleRelease --no-daemon --stacktrace || true
          ./gradlew :app:assembleWearRelease --no-daemon --stacktrace || true

      - name: Resolve Version and Changelog
        id: version
        run: |
          CODE=$(grep 'VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          [ -z "$CODE" ] && CODE=30101
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          
          AR_FILE="fastlane/metadata/android/ar/changelogs/${CODE}.txt"
          EN_FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          echo "ar_file=$AR_FILE" >> "$GITHUB_OUTPUT"
          echo "en_file=$EN_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: "Wafeer ${{ github.ref_name }}"
          AR_FILE: ${{ steps.version.outputs.ar_file }}
          EN_FILE: ${{ steps.version.outputs.en_file }}
        run: |
          shopt -s nullglob
          PHONE_APK=$(ls app/build/outputs/apk/foss/release/Wafeer-v*.apk 2>/dev/null | grep -v -- '-arm' | grep -v -- '-x86' | head -n 1)
          WATCH_APK=$(ls wear/build/outputs/apk/release/Wafeer-Watch-v*.apk 2>/dev/null | head -n 1)
          APKS=()
          [ -f "$PHONE_APK" ] && APKS+=("$PHONE_APK")
          [ -f "$WATCH_APK" ] && APKS+=("$WATCH_APK")
          echo "Selected APKs (${#APKS[@]}): ${APKS[*]}"
          
          format_bilingual_release_notes() {
            local ar_path="$1"
            local en_path="$2"
            local ver_tag="$3"
            local out_file="$4"
            python3 - "$ar_path" "$en_path" "$ver_tag" "$out_file" << 'PYEOF'
          import sys, os

          ar_path, en_path, ver_tag, out_file = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          def parse_items(p):
              items = []
              if not os.path.exists(p):
                  return items
              with open(p, "r", encoding="utf-8") as f:
                  for raw in f:
                      line = raw.strip()
                      if not line.startswith("- ") and not line.startswith("* "):
                          continue
                      content = line[2:].strip()
                      lower = content.lower()
                      if lower.startswith("feat:") or lower.startswith("feature:"):
                          items.append(content.split(":", 1)[1].strip())
                      elif lower.startswith("fix:") or lower.startswith("bug:"):
                          items.append(content.split(":", 1)[1].strip())
                      elif lower.startswith("improve:") or lower.startswith("perf:"):
                          items.append(content.split(":", 1)[1].strip())
                      else:
                          items.append(content)
              return items

          ar_items = parse_items(ar_path)
          en_items = parse_items(en_path)

          lines = [f"# Wafeer {ver_tag} • وفير {ver_tag}", ""]

          if ar_items:
              lines.append("## ما الجديد:")
              for it in ar_items:
                  lines.append(f"- {it}")
              lines.append("")
              lines.append("---")
              lines.append("")

          if en_items:
              lines.append("## What's New:")
              for it in en_items:
                  lines.append(f"- {it}")
              lines.append("")

          if not ar_items and not en_items:
              lines.append("- General improvements and bug fixes.")

          with open(out_file, "w", encoding="utf-8") as out:
              out.write("\n".join(lines).strip() + "\n")
          PYEOF
          }

          NOTES_FILE="release_notes.md"
          format_bilingual_release_notes "$AR_FILE" "$EN_FILE" "$TAG" "$NOTES_FILE"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "${APKS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE • وفير $TAG" --notes-file "$NOTES_FILE"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${APKS[@]}" --title "$TITLE • وفير $TAG" --notes-file "$NOTES_FILE"
          fi
