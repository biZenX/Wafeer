<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وفير — وتيرة الصرف السريعة (الوعاء المائل والترنح الجيروسكوبي ثلاثي الأبعاد)</title>
<style>
  :root {
    --bg: #080c0b;
    --teal: #48FEBD;
    --mint: #AFF5A7;
    --pace-speed: 1;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage-box {
    width: 320px; height: 380px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    perspective: 800px;
  }
  svg {
    width: 100%; height: 330px;
    overflow: visible;
    filter: drop-shadow(0 0 16px rgba(72, 254, 189, 0.28));
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ===== Sprinting Tilted Pot with Dynamic Locomotion & Vibration ===== */
  .sprint-tilt-rig {
    transform-origin: 172px 234px;
    animation: potSprintCadence 0.45s ease-in-out infinite alternate;
  }
  @keyframes potSprintCadence {
    0% {
      /* Step impact strike: footfall shock */
      transform: rotate(18.5deg) translate(1px, 2px);
    }
    100% {
      /* Spring-off rebound */
      transform: rotate(22deg) translate(-2px, -5px);
    }
  }

  /* High-frequency Footfall Micro-Vibration (18Hz) */
  .pot-vibration {
    transform-origin: 172px 234px;
    animation: footfallShudder 0.055s linear infinite alternate;
  }
  @keyframes footfallShudder {
    0% { transform: translate3d(-0.6px, 0.4px, 0) rotate(-0.35deg); }
    100% { transform: translate3d(0.6px, -0.4px, 0) rotate(0.35deg); }
  }

  /* Macro Tilt & Near-Spill Hazard Cycle */
  .macro-tilt-cycle {
    transform-origin: 172px 234px;
    animation: tiltHazardCycle 3.6s ease-in-out infinite;
  }
  @keyframes tiltHazardCycle {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(3deg); }
    35%, 75% { transform: rotate(5deg); } /* Maximum sustained sprinting tilt */
    90% { transform: rotate(1.5deg); }
  }

  /* ===== 3D Gyroscopic Coin Wobble & Nutation ===== */
  .coin-gyro-container {
    transform-origin: 96px 42px;
    perspective: 450px;
    transform-style: preserve-3d;
  }

  /* Dangerous edge slip and centrifugal recovery */
  .coin-slip-track {
    transform-origin: 96px 42px;
    animation: coinCentrifugalSlide 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes coinCentrifugalSlide {
    0%, 10% {
      transform: translate(0, 0) rotate(0deg);
    }
    20% {
      transform: translate(12px, 9px) rotate(18deg);
    }
    /* Sliding towards the steep brink */
    35% {
      transform: translate(25px, 15px) rotate(38deg);
    }
    48%, 68% {
      /* Teetering right on the precipice of falling! */
      transform: translate(32px, 19px) rotate(52deg);
    }
    75% {
      /* Alarming last-second slip */
      transform: translate(34px, 21px) rotate(56deg);
    }
    85% {
      /* Gyroscopic self-righting recovery snap */
      transform: translate(14px, 8px) rotate(22deg);
    }
    95%, 100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  /* 3D Gyroscopic Nutation (Precession around an elliptical cone) */
  .coin-gyro-nutation {
    transform-origin: 96px 42px;
    transform-style: preserve-3d;
    animation: gyroscopicWobble 0.28s ease-in-out infinite alternate;
  }
  @keyframes gyroscopicWobble {
    0% {
      transform: perspective(450px) rotateX(15deg) rotateY(42deg) rotateZ(30deg);
    }
    100% {
      transform: perspective(450px) rotateX(25deg) rotateY(64deg) rotateZ(46deg);
    }
  }

  /* Metallic Rim Sheen sweep */
  .gyro-sheen {
    opacity: 0.2;
    animation: sheenSweep 0.28s linear infinite alternate;
  }
  @keyframes sheenSweep {
    0% { opacity: 0.15; transform: translateX(-12px); }
    100% { opacity: 0.85; transform: translateX(12px); }
  }

  /* ===== Aerodynamic Speed Lines (Wind Streaks) ===== */
  .wind-streak {
    stroke: var(--teal);
    stroke-linecap: round;
    opacity: 0;
    stroke-dasharray: 45;
    animation: windRush 0.55s linear infinite;
  }
  @keyframes windRush {
    0% {
      stroke-dashoffset: 45;
      opacity: 0;
      transform: translateX(35px);
    }
    30% {
      opacity: 0.75;
    }
    80% {
      opacity: 0.6;
    }
    100% {
      stroke-dashoffset: -45;
      opacity: 0;
      transform: translateX(-45px);
    }
  }

  /* ===== Flying Exertion Sweat Droplets ===== */
  .sweat-drop {
    fill: var(--teal);
    opacity: 0;
    animation: sweatFly 0.9s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
  }
  @keyframes sweatFly {
    0% {
      transform: translate(0, 0) scale(0.3);
      opacity: 0;
    }
    20% {
      opacity: 0.9;
      transform: translate(-6px, -4px) scale(1);
    }
    80% {
      opacity: 0.6;
      transform: translate(-32px, 8px) scale(0.75);
    }
    100% {
      opacity: 0;
      transform: translate(-50px, 18px) scale(0.2);
    }
  }

  /* Interactive HUD */
  .hud-panel {
    position: absolute; bottom: 8px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(14, 20, 19, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(72, 254, 189, 0.2);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    color: var(--mint);
    z-index: 10;
  }
  .hud-btn {
    appearance: none; border: 1px solid rgba(72, 254, 189, 0.35);
    background: rgba(72, 254, 189, 0.12);
    color: #fff; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hud-btn:hover {
    background: var(--teal);
    color: #08110e;
    box-shadow: 0 0 10px rgba(72, 254, 189, 0.5);
  }
  .hud-tag {
    opacity: 0.75;
    font-size: 10.5px;
    direction: ltr;
  }
</style>
</head>
<body>

<div class="stage-box" id="stageBox">
  <svg id="svgRoot" xmlns="http://www.w3.org/2000/svg" viewBox="-25 0 235 255" fill="none">
    <defs>
      <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#AFF5A7" />
        <stop offset="100%" stop-color="#48FEBD" />
      </linearGradient>
      <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5AC17A" />
        <stop offset="100%" stop-color="#388E3C" />
      </linearGradient>
      <clipPath id="coinFaceClip">
        <path d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z" />
      </clipPath>
    </defs>

    <!-- ===== Aerodynamic Wind Streaks (Past the sprinting pot) ===== -->
    <line class="wind-streak" x1="160" y1="55" x2="205" y2="55" stroke-width="2.2" style="animation-delay: 0s;" />
    <line class="wind-streak" x1="145" y1="95" x2="195" y2="95" stroke-width="1.8" style="animation-delay: -0.18s;" />
    <line class="wind-streak" x1="165" y1="140" x2="215" y2="140" stroke-width="2.4" style="animation-delay: -0.32s;" />
    <line class="wind-streak" x1="150" y1="185" x2="198" y2="185" stroke-width="1.6" style="animation-delay: -0.45s;" />

    <!-- ===== Macro Tilt Cycle Container ===== -->
    <g class="macro-tilt-cycle">
      <!-- Sprint Cadence & Footfall Shudder -->
      <g class="sprint-tilt-rig" id="sprintRig">
        <g class="pot-vibration">

          <!-- ===== Sprinting Pot Body ===== -->
          <path fill="url(#potGrad)" fill-rule="evenodd" d="M 56.5,79.715 C 27.539,83.72 13.425,100.025 26.262,114.646 C 29.892,118.78 29.225,121.152 22.131,129.349 C -2.127,157.377 -3.641,194.866 18.566,217.611 C 21.555,220.673 24,223.304 24,223.459 C 24,223.613 21.188,224.293 17.75,224.969 C 9.958,226.501 8,227.529 8,230.086 C 8,239.466 91.486,242.125 127.5,233.892 C 152.705,228.129 167.929,214.123 172.489,192.5 C 177.102,170.628 170.017,147.544 152.756,128.199 C 146.179,120.828 144.356,116.779 146.728,114.811 C 151.39,110.946 152.288,101.36 148.51,95.8 C 143.653,88.652 121.438,81.133 117.327,85.245 C 114.791,87.781 116.876,89.414 126.472,92.406 C 143.39,97.681 146.132,105.895 133.164,112.453 C 119.319,119.455 62.629,120.024 42.139,113.366 C 21.299,106.595 30.54,91.901 58.5,87.353 C 69.511,85.562 72,84.599 72,82.128 C 72,79.128 66.703,78.304 56.5,79.715 M 72.978,91.113 C 55.999,92.482 45.764,96.615 47.586,101.365 C 50.657,109.366 107.039,111.719 121.128,104.434 C 135.618,96.941 105.168,88.517 72.978,91.113 M 36.944,125.135 C 36.206,126.916 33.531,130.877 30.999,133.937 C 28.467,136.997 25.043,141.525 23.39,144 C 3.864,173.243 13.254,212.289 42.298,222.617 C 67.567,231.602 121.034,230.186 140.997,220.002 C 168.539,205.951 170.47,163.878 144.913,134.648 C 141.65,130.915 138.274,126.497 137.412,124.829 C 136.208,122.501 135.339,121.915 133.672,122.305 C 116.431,126.343 93.813,128.339 75.671,127.425 C 65.287,126.902 43.553,123.917 39.889,122.511 C 38.74,122.07 37.905,122.814 36.944,125.135 M 131.667,144.667 C 130.059,146.275 131.273,150.136 134.651,154.155 C 138.701,158.975 142.354,166.526 143.402,172.242 C 144.215,176.68 148.007,178.421 150.792,175.636 C 154.204,172.225 148.362,155.619 141.046,147.928 C 137.543,144.245 133.495,142.838 131.667,144.667 M 66.2,163.2 C 61.444,167.956 70.499,177 80.018,177 C 89.032,177 97.48,167.88 92.8,163.2 C 91.004,161.404 90.428,161.646 86.117,166 C 80.621,171.551 75.695,171.179 72.485,164.97 C 70.886,161.879 68.261,161.139 66.2,163.2" />

          <!-- Sparkles (stressed lean) -->
          <path fill="#48FEBD" opacity="0.18" fill-rule="evenodd" d="M 138.92,10.92 C 132.456,17.384 131.305,21.187 135.628,21.804 C 138.347,22.191 149.5,10.81 149.5,7.647 C 149.5,3.18 145.389,4.451 138.92,10.92 M 148.09,37.818 C 141.428,39.566 139.205,41.485 140.359,44.492 C 141.084,46.383 141.192,46.377 153.5,43.721 C 158.577,42.625 159.552,42.065 159.837,40.076 C 160.459,35.748 157.875,35.251 148.09,37.818 M 39.614,38.529 C 37.443,40.7 38.607,42.818 45.261,48.811 C 51.586,54.509 52.133,54.725 54.429,52.429 C 57.019,49.838 56.773,49.395 48.739,42.176 C 42.432,36.509 41.862,36.281 39.614,38.529" />

          <!-- Exertion Sweat Droplets Flying into Slipstream -->
          <circle class="sweat-drop" cx="126" cy="12" r="3.2" style="animation-delay: 0s;" />
          <circle class="sweat-drop" cx="142" cy="18" r="2.6" style="animation-delay: -0.45s;" />

          <!-- ===== 3D Gyroscopic Precessing & Wobbling Coin ===== -->
          <g class="coin-gyro-container">
            <g class="coin-slip-track">
              <g class="coin-gyro-nutation" id="coinNutation">
                <!-- Coin Core -->
                <path fill="url(#coinGrad)" d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z" />
                <!-- Official Rim Stroke -->
                <path fill="#48FEBD" fill-rule="evenodd" d="M 81.332,6.497 C 72.794,10.688 69.577,14.206 67.383,21.756 C 61.007,43.687 81.417,78.842 100.603,78.978 C 105.216,79.011 116.925,74.446 120.147,71.359 C 131.894,60.105 126.835,29.23 110.529,12.661 C 100.605,2.577 92.714,0.911 81.332,6.497 M 83.09,12.265 C 71.748,18.079 75.084,46.867 88.877,62.209 C 108.236,83.74 126.491,63.317 114.426,33.625 C 107.591,16.806 93.273,7.045 83.09,12.265" />
                <!-- 3D Specular Sheen across Gyro Wobble -->
                <g clip-path="url(#coinFaceClip)">
                  <path class="gyro-sheen" fill="#FFFFFF" d="M 80,5 L 100,5 L 120,80 L 100,80 Z" />
                </g>
              </g>
            </g>
          </g>

        </g>
      </g>
    </g>
  </svg>

  <!-- Interactive Telemetry HUD -->
  <div class="hud-panel">
    <button class="hud-btn" id="btnTurbo">🔥 وتيرة خارقة</button>
    <button class="hud-btn" id="btnCadence">🏃 السرعة: ×1.6</button>
    <span class="hud-tag">tilt 21° · 3D gyroscopic wobble</span>
  </div>
</div>

<script>
  const stageBox = document.getElementById('stageBox');
  const svgRoot = document.getElementById('svgRoot');
  const sprintRig = document.getElementById('sprintRig');
  const coinNutation = document.getElementById('coinNutation');
  const btnTurbo = document.getElementById('btnTurbo');
  const btnCadence = document.getElementById('btnCadence');

  let speedMode = 1; // 0: Normal 1.0x, 1: Fast 1.6x, 2: Turbo 2.8x
  const modes = [
    { label: '🚶 السرعة: ×1.0', cadence: '0.65s', nutation: '0.4s' },
    { label: '🏃 السرعة: ×1.6', cadence: '0.45s', nutation: '0.28s' },
    { label: '⚡ السرعة: ×2.8', cadence: '0.22s', nutation: '0.14s' }
  ];

  // Mouse interactive tilt and drag
  stageBox.addEventListener('mousemove', (e) => {
    const rect = stageBox.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    svgRoot.style.transform = `rotateY(${x * 20}deg) rotateX(${-y * 18}deg)`;
  });
  stageBox.addEventListener('mouseleave', () => {
    svgRoot.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });

  // Cycle speed mode
  btnCadence.addEventListener('click', (e) => {
    e.stopPropagation();
    speedMode = (speedMode + 1) % 3;
    applySpeed(speedMode);
  });

  function applySpeed(modeIdx) {
    const m = modes[modeIdx];
    btnCadence.textContent = m.label;
    sprintRig.style.animationDuration = m.cadence;
    coinNutation.style.animationDuration = m.nutation;
  }

  // Turbo Boost Burst
  function triggerTurboBoost() {
    svgRoot.style.transform = 'scale(1.06) rotate(6deg)';
    applySpeed(2);
    setTimeout(() => {
      svgRoot.style.transform = 'scale(1) rotate(0deg)';
      applySpeed(speedMode);
    }, 1800);
  }

  btnTurbo.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerTurboBoost();
  });
  stageBox.addEventListener('click', triggerTurboBoost);
</script>
</body>
</html>
