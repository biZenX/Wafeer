<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وفير — الصرف الزائد (الشرخ الواقعي ورعشة العملة ثلاثية الأبعاد)</title>
<style>
  :root {
    --bg: #080c0b;
    --teal: #48FEBD;
    --mint: #AFF5A7;
    --dark-fissure: #02120e;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage-box {
    width: 320px; height: 380px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    perspective: 800px;
  }
  svg {
    width: 100%; height: 320px;
    overflow: visible;
    filter: drop-shadow(0 0 16px rgba(72, 254, 189, 0.28));
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ===== 3D Perspective Coins with Anxious Shivering ===== */
  .coin-3d-rig {
    transform-origin: 96px 40px;
    perspective: 450px;
    transform-style: preserve-3d;
    animation: coinAnxiousCycle 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  .coin-shiver {
    transform-origin: 96px 40px;
    animation: coinMicroTremor 0.055s linear infinite alternate;
  }

  @keyframes coinAnxiousCycle {
    0% {
      transform: perspective(450px) rotateX(12deg) rotateY(-10deg) rotateZ(-3deg) translateY(0);
    }
    20% {
      transform: perspective(450px) rotateX(18deg) rotateY(-18deg) rotateZ(-6deg) translateY(1.5px);
    }
    /* SNAP! Fracture impulse shockwave */
    27% {
      transform: perspective(450px) rotateX(-22deg) rotateY(16deg) rotateZ(8deg) translateY(-9px) scale(1.06);
    }
    31% {
      transform: perspective(450px) rotateX(16deg) rotateY(-12deg) rotateZ(-4deg) translateY(2.5px);
    }
    36% {
      transform: perspective(450px) rotateX(-6deg) rotateY(6deg) rotateZ(2deg) translateY(-1px);
    }
    43% {
      transform: perspective(450px) rotateX(14deg) rotateY(-14deg) rotateZ(-5deg) translateY(1px);
    }
    75% {
      transform: perspective(450px) rotateX(15deg) rotateY(-16deg) rotateZ(-5deg) translateY(0.5px);
    }
    100% {
      transform: perspective(450px) rotateX(12deg) rotateY(-10deg) rotateZ(-3deg) translateY(0);
    }
  }

  /* Rapid 18-20Hz anxious shivering */
  @keyframes coinMicroTremor {
    0% {
      transform: translate3d(-0.7px, 0.5px, 0) rotate(-0.7deg);
    }
    100% {
      transform: translate3d(0.8px, -0.6px, 0) rotate(0.8deg);
    }
  }

  /* Dynamic Specular Sheen across Coin Face */
  .coin-sheen {
    opacity: 0.15;
    animation: sheenShift 3.6s ease-in-out infinite;
  }
  @keyframes sheenShift {
    0%, 20% { opacity: 0.12; transform: translateX(-15px); }
    27% { opacity: 0.85; transform: translateX(8px); }
    35%, 100% { opacity: 0.15; transform: translateX(0); }
  }

  /* ===== Pot Unease & Elastic Recoil ===== */
  .pot-unease {
    transform-origin: 88px 236px;
    animation: potRecoilCycle 3.6s cubic-bezier(0.3, 0, 0.2, 1) infinite;
  }
  @keyframes potRecoilCycle {
    0%, 20% {
      transform: rotate(0deg) scale(1, 1);
    }
    23% {
      /* Anticipatory compression right before fissure snaps */
      transform: scale(1.018, 0.982) translateY(1px);
    }
    27% {
      /* Jolt! Impulse recoil */
      transform: rotate(-0.9deg) translate(-1.8px, 1.2px) scale(0.985, 1.015);
    }
    31% {
      transform: rotate(0.8deg) translate(1.4px, -0.8px);
    }
    36% {
      transform: rotate(-0.4deg) translate(-0.8px, 0.4px);
    }
    43% {
      transform: rotate(0.2deg) translate(0.4px, -0.2px);
    }
    52%, 100% {
      transform: rotate(0deg) translate(0, 0) scale(1, 1);
    }
  }

  /* ===== Realistic Dynamic Crack Opening ===== */
  .crack-outer {
    stroke: var(--dark-fissure);
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 130;
    animation: crackExpand 3.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }
  .crack-inner {
    stroke: var(--teal);
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 130;
    filter: drop-shadow(0 0 4px var(--teal));
    animation: crackGlow 3.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }
  @keyframes crackExpand {
    0%, 22% { stroke-dashoffset: 130; stroke-width: 0; opacity: 0; }
    27% { stroke-dashoffset: 15; stroke-width: 3.8; opacity: 1; }
    32% { stroke-dashoffset: 0; stroke-width: 4.2; opacity: 1; }
    75% { stroke-dashoffset: 0; stroke-width: 3.6; opacity: 1; }
    92% { stroke-dashoffset: 0; stroke-width: 1.5; opacity: 0.3; }
    100% { stroke-dashoffset: 130; stroke-width: 0; opacity: 0; }
  }
  @keyframes crackGlow {
    0%, 22% { stroke-dashoffset: 130; stroke-width: 0; opacity: 0; }
    27% { stroke-dashoffset: 15; stroke-width: 2.0; opacity: 1; }
    32% { stroke-dashoffset: 0; stroke-width: 1.6; opacity: 0.85; }
    75% { stroke-dashoffset: 0; stroke-width: 1.2; opacity: 0.6; }
    92% { stroke-dashoffset: 0; stroke-width: 0.8; opacity: 0.2; }
    100% { stroke-dashoffset: 130; stroke-width: 0; opacity: 0; }
  }

  /* Lateral Crack Branches */
  .crack-branch-1 {
    stroke: var(--dark-fissure); stroke-width: 2.8; stroke-linecap: round; fill: none;
    stroke-dasharray: 30;
    animation: branch1Cycle 3.6s ease-out infinite;
  }
  @keyframes branch1Cycle {
    0%, 27% { stroke-dashoffset: 30; opacity: 0; }
    30% { stroke-dashoffset: 0; opacity: 1; }
    75% { opacity: 0.9; }
    95%, 100% { stroke-dashoffset: 30; opacity: 0; }
  }

  .crack-branch-2 {
    stroke: var(--dark-fissure); stroke-width: 2.4; stroke-linecap: round; fill: none;
    stroke-dasharray: 25;
    animation: branch2Cycle 3.6s ease-out infinite;
  }
  @keyframes branch2Cycle {
    0%, 28% { stroke-dashoffset: 25; opacity: 0; }
    32% { stroke-dashoffset: 0; opacity: 1; }
    75% { opacity: 0.85; }
    95%, 100% { stroke-dashoffset: 25; opacity: 0; }
  }

  /* ===== Ballistic Micro-Shards ===== */
  .shard {
    transform-origin: center;
    transform-box: fill-box;
    opacity: 0;
    animation: shardBlast 3.6s cubic-bezier(0.1, 0.9, 0.2, 1) infinite;
  }
  @keyframes shardBlast {
    0%, 26% {
      opacity: 0;
      transform: translate(0, 0) scale(0.2) rotate(0deg);
    }
    27% {
      opacity: 1;
      transform: translate(calc(var(--vx) * 0.3px), calc(var(--vy) * 0.3px)) scale(1.1) rotate(45deg);
    }
    40% {
      opacity: 1;
      transform: translate(calc(var(--vx) * 1px), calc(var(--vy) * 1px + 8px)) scale(0.9) rotate(var(--rot));
    }
    55% {
      opacity: 0;
      transform: translate(calc(var(--vx) * 1.35px), calc(var(--vy) * 1.35px + 28px)) scale(0.4) rotate(calc(var(--rot) * 1.6));
    }
    100% {
      opacity: 0;
      transform: translate(0, 0) scale(0);
    }
  }

  /* Ceramic Dust Puffs */
  .dust {
    opacity: 0;
    animation: dustPuff 3.6s ease-out infinite;
  }
  @keyframes dustPuff {
    0%, 26% { opacity: 0; transform: scale(0.2); }
    27% { opacity: 0.8; transform: scale(1.2); }
    40% { opacity: 0.4; transform: scale(2.2); }
    55%, 100% { opacity: 0; transform: scale(3); }
  }

  /* Interactive HUD */
  .hud-panel {
    position: absolute; bottom: 8px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(14, 20, 19, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(72, 254, 189, 0.2);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    color: var(--mint);
    z-index: 10;
  }
  .hud-btn {
    appearance: none; border: 1px solid rgba(72, 254, 189, 0.35);
    background: rgba(72, 254, 189, 0.12);
    color: #fff; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hud-btn:hover {
    background: var(--teal);
    color: #08110e;
    box-shadow: 0 0 10px rgba(72, 254, 189, 0.5);
  }
  .hud-tag {
    opacity: 0.75;
    font-size: 10.5px;
    direction: ltr;
  }
</style>
</head>
<body>

<div class="stage-box" id="stageBox">
  <svg id="svgRoot" xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 195 245" fill="none">
    <defs>
      <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#AFF5A7" />
        <stop offset="100%" stop-color="#48FEBD" />
      </linearGradient>
      <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5AC17A" />
        <stop offset="100%" stop-color="#388E3C" />
      </linearGradient>
      <linearGradient id="shardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#AFF5A7" />
        <stop offset="100%" stop-color="#48FEBD" />
      </linearGradient>
      <clipPath id="coinClip">
        <path d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z" />
      </clipPath>
    </defs>

    <!-- ===== Pot with Unease Recoil ===== -->
    <g class="pot-unease">
      <!-- Official Pot Body -->
      <path fill="url(#potGrad)" fill-rule="evenodd" d="M 56.5,79.715 C 27.539,83.72 13.425,100.025 26.262,114.646 C 29.892,118.78 29.225,121.152 22.131,129.349 C -2.127,157.377 -3.641,194.866 18.566,217.611 C 21.555,220.673 24,223.304 24,223.459 C 24,223.613 21.188,224.293 17.75,224.969 C 9.958,226.501 8,227.529 8,230.086 C 8,239.466 91.486,242.125 127.5,233.892 C 152.705,228.129 167.929,214.123 172.489,192.5 C 177.102,170.628 170.017,147.544 152.756,128.199 C 146.179,120.828 144.356,116.779 146.728,114.811 C 151.39,110.946 152.288,101.36 148.51,95.8 C 143.653,88.652 121.438,81.133 117.327,85.245 C 114.791,87.781 116.876,89.414 126.472,92.406 C 143.39,97.681 146.132,105.895 133.164,112.453 C 119.319,119.455 62.629,120.024 42.139,113.366 C 21.299,106.595 30.54,91.901 58.5,87.353 C 69.511,85.562 72,84.599 72,82.128 C 72,79.128 66.703,78.304 56.5,79.715 M 72.978,91.113 C 55.999,92.482 45.764,96.615 47.586,101.365 C 50.657,109.366 107.039,111.719 121.128,104.434 C 135.618,96.941 105.168,88.517 72.978,91.113 M 36.944,125.135 C 36.206,126.916 33.531,130.877 30.999,133.937 C 28.467,136.997 25.043,141.525 23.39,144 C 3.864,173.243 13.254,212.289 42.298,222.617 C 67.567,231.602 121.034,230.186 140.997,220.002 C 168.539,205.951 170.47,163.878 144.913,134.648 C 141.65,130.915 138.274,126.497 137.412,124.829 C 136.208,122.501 135.339,121.915 133.672,122.305 C 116.431,126.343 93.813,128.339 75.671,127.425 C 65.287,126.902 43.553,123.917 39.889,122.511 C 38.74,122.07 37.905,122.814 36.944,125.135 M 131.667,144.667 C 130.059,146.275 131.273,150.136 134.651,154.155 C 138.701,158.975 142.354,166.526 143.402,172.242 C 144.215,176.68 148.007,178.421 150.792,175.636 C 154.204,172.225 148.362,155.619 141.046,147.928 C 137.543,144.245 133.495,142.838 131.667,144.667 M 66.2,163.2 C 61.444,167.956 70.499,177 80.018,177 C 89.032,177 97.48,167.88 92.8,163.2 C 91.004,161.404 90.428,161.646 86.117,166 C 80.621,171.551 75.695,171.179 72.485,164.97 C 70.886,161.879 68.261,161.139 66.2,163.2" />

      <!-- Official Sparkles (faint under stress) -->
      <path fill="#48FEBD" opacity="0.16" fill-rule="evenodd" d="M 138.92,10.92 C 132.456,17.384 131.305,21.187 135.628,21.804 C 138.347,22.191 149.5,10.81 149.5,7.647 C 149.5,3.18 145.389,4.451 138.92,10.92 M 148.09,37.818 C 141.428,39.566 139.205,41.485 140.359,44.492 C 141.084,46.383 141.192,46.377 153.5,43.721 C 158.577,42.625 159.552,42.065 159.837,40.076 C 160.459,35.748 157.875,35.251 148.09,37.818 M 39.614,38.529 C 37.443,40.7 38.607,42.818 45.261,48.811 C 51.586,54.509 52.133,54.725 54.429,52.429 C 57.019,49.838 56.773,49.395 48.739,42.176 C 42.432,36.509 41.862,36.281 39.614,38.529" />

      <!-- ===== Realistic Fissure Propagation ===== -->
      <!-- Outer deep dark fracture -->
      <path class="crack-outer" d="M 96,125 L 87,142 L 99,158 L 83,176 L 97,194 L 85,208 L 98,224" />
      <!-- Inner glowing energy stress line -->
      <path class="crack-inner" d="M 96,125 L 87,142 L 99,158 L 83,176 L 97,194 L 85,208 L 98,224" />

      <!-- Dynamic Branch Cracks -->
      <path class="crack-branch-1" d="M 87,142 L 72,136 L 63,140" />
      <path class="crack-branch-2" d="M 99,158 L 115,166 L 124,163" />
      <path class="crack-branch-1" d="M 83,176 L 69,186 L 58,183" />
    </g>

    <!-- ===== Anxious 3D Shivering Coin ===== -->
    <g class="coin-3d-rig" id="coinRig">
      <g class="coin-shiver">
        <!-- Coin Core Fill -->
        <path fill="url(#coinGrad)" d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z" />
        <!-- Coin Rim / Official Emerald Stroke -->
        <path fill="#48FEBD" fill-rule="evenodd" d="M 81.332,6.497 C 72.794,10.688 69.577,14.206 67.383,21.756 C 61.007,43.687 81.417,78.842 100.603,78.978 C 105.216,79.011 116.925,74.446 120.147,71.359 C 131.894,60.105 126.835,29.23 110.529,12.661 C 100.605,2.577 92.714,0.911 81.332,6.497 M 83.09,12.265 C 71.748,18.079 75.084,46.867 88.877,62.209 C 108.236,83.74 126.491,63.317 114.426,33.625 C 107.591,16.806 93.273,7.045 83.09,12.265" />
        <!-- Sheen Highlight -->
        <g clip-path="url(#coinClip)">
          <path class="coin-sheen" fill="#FFFFFF" d="M 75,0 L 95,0 L 125,85 L 105,85 Z" />
        </g>
      </g>
    </g>

    <!-- ===== Ballistic Micro-Shards Bursting from Fracture Points ===== -->
    <!-- Point 1 (87, 142) -->
    <polygon class="shard" style="--vx: -35; --vy: -22; --rot: 240deg;" points="87,142 84,139 88,137" fill="url(#shardGrad)" />
    <polygon class="shard" style="--vx: 28; --vy: -18; --rot: -190deg;" points="87,142 90,140 89,145" fill="#AFF5A7" />
    <polygon class="shard" style="--vx: -48; --vy: 8; --rot: 310deg;" points="87,142 82,143 85,147" fill="#48FEBD" />

    <!-- Point 2 (99, 158) -->
    <polygon class="shard" style="--vx: 45; --vy: -14; --rot: 180deg;" points="99,158 103,155 102,160" fill="url(#shardGrad)" />
    <polygon class="shard" style="--vx: -24; --vy: -12; --rot: -260deg;" points="99,158 95,157 97,162" fill="#AFF5A7" />
    <polygon class="shard" style="--vx: 52; --vy: 16; --rot: 340deg;" points="99,158 104,161 101,165" fill="#48FEBD" />

    <!-- Point 3 (83, 176) -->
    <polygon class="shard" style="--vx: -42; --vy: -20; --rot: 280deg;" points="83,176 79,173 81,178" fill="url(#shardGrad)" />
    <polygon class="shard" style="--vx: 38; --vy: 12; --rot: -150deg;" points="83,176 87,178 85,182" fill="#AFF5A7" />
    <polygon class="shard" style="--vx: -25; --vy: 24; --rot: 210deg;" points="83,176 80,180 84,181" fill="#48FEBD" />

    <!-- Point 4 (97, 194) -->
    <polygon class="shard" style="--vx: 32; --vy: -10; --rot: 190deg;" points="97,194 101,192 100,197" fill="url(#shardGrad)" />
    <polygon class="shard" style="--vx: -30; --vy: 15; --rot: -220deg;" points="97,194 93,196 95,200" fill="#AFF5A7" />

    <!-- Dust Puffs at Impact Points -->
    <circle class="dust" cx="87" cy="142" r="3.5" fill="rgba(72,254,189,0.3)" />
    <circle class="dust" cx="99" cy="158" r="4.0" fill="rgba(175,245,167,0.35)" />
    <circle class="dust" cx="83" cy="176" r="3.8" fill="rgba(72,254,189,0.3)" />
  </svg>

  <!-- Interactive Telemetry HUD -->
  <div class="hud-panel">
    <button class="hud-btn" id="btnImpulse">⚡ صدمة الشرخ</button>
    <span class="hud-tag">3D perspective · 22Hz shiver · shards: 11</span>
  </div>
</div>

<script>
  const stageBox = document.getElementById('stageBox');
  const svgRoot = document.getElementById('svgRoot');
  const coinRig = document.getElementById('coinRig');
  const btnImpulse = document.getElementById('btnImpulse');

  // Interactive 3D Perspective Tilt with Mouse
  stageBox.addEventListener('mousemove', (e) => {
    const rect = stageBox.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    svgRoot.style.transform = `rotateY(${x * 22}deg) rotateX(${-y * 22}deg)`;
  });
  stageBox.addEventListener('mouseleave', () => {
    svgRoot.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });

  // Tap/Click to Force Instant Impulse Shockwave
  function triggerCrackPulse() {
    svgRoot.style.transform = 'scale(0.96) translate(1px, -2px)';
    coinRig.style.transform = 'perspective(450px) rotateX(-28deg) rotateY(20deg) translateY(-14px) scale(1.1)';
    setTimeout(() => {
      svgRoot.style.transform = 'scale(1.02) translate(-1px, 2px)';
      coinRig.style.transform = 'perspective(450px) rotateX(20deg) rotateY(-18deg) translateY(4px)';
    }, 120);
    setTimeout(() => {
      svgRoot.style.transform = 'scale(1) translate(0, 0)';
      coinRig.style.transform = '';
    }, 280);
  }

  btnImpulse.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerCrackPulse();
  });
  stageBox.addEventListener('click', triggerCrackPulse);
</script>
</body>
</html>
