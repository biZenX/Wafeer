<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وفير — انشطار الوعاء وسقوط العملة بفيزياء الجاذبية ثلاثية الأبعاد</title>
<style>
  :root {
    --bg: #080c0b;
    --teal: #48FEBD;
    --mint: #AFF5A7;
    --dark-fissure: #02120e;
    --anim-speed: 1;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage-box {
    width: 320px; height: 380px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    perspective: 800px;
  }
  svg {
    width: 100%; height: 320px;
    overflow: visible;
    filter: drop-shadow(0 0 16px rgba(72, 254, 189, 0.25));
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ===== Camera Shockwave at Fracture ===== */
  .camera-rig {
    transform-origin: 96px 150px;
    animation: camShake 3.8s linear infinite;
  }
  @keyframes camShake {
    0%, 14.5% { transform: translate(0, 0) rotate(0deg); }
    15% { transform: translate(-3.2px, 2.2px) rotate(-0.6deg); }
    15.6% { transform: translate(3px, -2px) rotate(0.55deg); }
    16.3% { transform: translate(-2.4px, 1.6px) rotate(-0.45deg); }
    17.2% { transform: translate(1.8px, -1.2px) rotate(0.35deg); }
    18.5% { transform: translate(-1px, 0.7px) rotate(-0.2deg); }
    20% { transform: translate(0.5px, -0.3px) rotate(0.1deg); }
    22%, 31.5% { transform: translate(0, 0) rotate(0deg); }
    /* Secondary small shake on Coin Bounce 1 */
    32% { transform: translate(-1.6px, 1.2px) rotate(-0.3deg); }
    32.8% { transform: translate(1.4px, -1px) rotate(0.25deg); }
    34% { transform: translate(-0.6px, 0.4px) rotate(-0.1deg); }
    36%, 100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* ===== Left & Right Splitting Pot Halves with Impulse Recoil ===== */
  .half-left {
    transform-origin: 20px 236px;
    animation: leftRecoil 3.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }
  .half-right {
    transform-origin: 168px 236px;
    animation: rightRecoil 3.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }

  @keyframes leftRecoil {
    0%, 14% {
      transform: translate(0, 0) rotate(0deg);
    }
    14.4% {
      /* Anticipatory groan compression */
      transform: translate(0.8px, 1px) scale(1.02, 0.98);
    }
    /* Impulse Kickback! */
    18% {
      transform: translate(-30px, 12px) rotate(-24deg);
    }
    22% {
      /* Ground bounce */
      transform: translate(-26px, 8px) rotate(-19deg);
    }
    27% {
      transform: translate(-29px, 11px) rotate(-22.5deg);
    }
    32%, 85% {
      transform: translate(-28px, 10px) rotate(-21deg);
    }
    /* Magnetic Reassembly */
    92% {
      transform: translate(-4px, 1px) rotate(-3deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  @keyframes rightRecoil {
    0%, 14% {
      transform: translate(0, 0) rotate(0deg);
    }
    14.4% {
      transform: translate(-0.8px, 1px) scale(1.02, 0.98);
    }
    /* Impulse Kickback! */
    18% {
      transform: translate(32px, 14px) rotate(26deg);
    }
    22% {
      /* Ground bounce */
      transform: translate(27px, 9px) rotate(20.5deg);
    }
    27% {
      transform: translate(31px, 13px) rotate(24.5deg);
    }
    32%, 85% {
      transform: translate(30px, 12px) rotate(23deg);
    }
    /* Magnetic Reassembly */
    92% {
      transform: translate(4px, 1px) rotate(3deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  /* Hollow Void / Chasm Opening */
  .fracture-chasm {
    fill: #02120e;
    opacity: 0;
    animation: chasmOpen 3.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }
  @keyframes chasmOpen {
    0%, 14% { opacity: 0; transform: scaleY(0.2); }
    18%, 85% { opacity: 0.95; transform: scaleY(1); }
    92%, 100% { opacity: 0; transform: scaleY(0.2); }
  }

  /* Pre-crack Stress Seam (creeping right before split) */
  .precrack-line {
    stroke: #02120e; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 120;
    animation: precrackCreep 3.8s ease-in-out infinite;
  }
  @keyframes precrackCreep {
    0% { stroke-dashoffset: 120; opacity: 0; }
    8% { stroke-dashoffset: 60; opacity: 0.7; }
    14% { stroke-dashoffset: 0; opacity: 1; stroke-width: 3.8; }
    15%, 100% { opacity: 0; }
  }

  /* ===== 3D Coin Dropping with Gravity Physics & Bounces ===== */
  .coin-physics-rig {
    transform-origin: 96px 40px;
    perspective: 600px;
    transform-style: preserve-3d;
    animation: coinGravityDrop 3.8s cubic-bezier(0.1, 0, 0.2, 1) infinite;
  }

  @keyframes coinGravityDrop {
    /* 0 - 14.5%: Suspended on top, anxious trembling */
    0%, 12% {
      transform: perspective(600px) translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1, 1);
    }
    14% {
      transform: perspective(600px) translateY(-2px) rotateX(8deg) rotateY(-6deg) rotateZ(-2deg) scale(1.02, 0.98);
    }
    /* 14.5% - 17%: Coyote-time hang delay while support collapses underneath */
    16% {
      transform: perspective(600px) translateY(2px) rotateX(15deg) rotateY(-12deg) rotateZ(-4deg) scale(1, 1);
    }
    /* 17% - 32%: Downward gravity acceleration + wild 3D tumbling */
    24% {
      transform: perspective(600px) translateY(78px) rotateX(160deg) rotateY(260deg) rotateZ(35deg) scale(1, 1);
    }
    31.5% {
      /* Just prior to ground impact */
      transform: perspective(600px) translateY(172px) rotateX(320deg) rotateY(540deg) rotateZ(65deg) scale(1, 1);
    }
    /* 32%: BOUNCE 1 - Impact with ground squash */
    32.5% {
      transform: perspective(600px) translateY(176px) rotateX(340deg) rotateY(560deg) rotateZ(70deg) scale(1.32, 0.68);
    }
    /* 33% - 41%: REBOUND 1 - launches up to 55% height */
    37% {
      transform: perspective(600px) translateY(96px) rotateX(460deg) rotateY(780deg) rotateZ(110deg) scale(1, 1);
    }
    43% {
      /* Approaching ground for Bounce 2 */
      transform: perspective(600px) translateY(168px) rotateX(560deg) rotateY(960deg) rotateZ(140deg) scale(1, 1);
    }
    /* 44%: BOUNCE 2 - Second floor impact */
    44.5% {
      transform: perspective(600px) translateY(176px) rotateX(580deg) rotateY(990deg) rotateZ(145deg) scale(1.18, 0.82);
    }
    /* 45% - 53%: REBOUND 2 - launches up to 20% height */
    49% {
      transform: perspective(600px) translateY(142px) rotateX(640deg) rotateY(1090deg) rotateZ(165deg) scale(1, 1);
    }
    /* 54% - 62%: Settling (Euler's Disk roll on rim) */
    54% {
      transform: perspective(600px) translateY(176px) rotateX(700deg) rotateY(1180deg) rotateZ(180deg) scale(1.08, 0.92);
    }
    58% {
      transform: perspective(600px) translateY(174px) rotateX(76deg) rotateY(40deg) rotateZ(195deg) scale(1, 1);
    }
    63%, 85% {
      /* At rest, lying tilted flat on the floor next to shards */
      transform: perspective(600px) translateY(174px) rotateX(78deg) rotateY(12deg) rotateZ(205deg) scale(1, 1);
    }
    /* 86% - 100%: Magnetic levitation back to intact pot */
    93% {
      transform: perspective(600px) translateY(45px) rotateX(25deg) rotateY(-8deg) rotateZ(35deg) scale(1, 1);
    }
    100% {
      transform: perspective(600px) translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1, 1);
    }
  }

  /* Ground Impact Rings (Shockwaves) */
  .bounce-shockwave {
    fill: none;
    stroke: var(--teal);
    stroke-width: 2.2;
    transform-origin: 96px 222px;
    opacity: 0;
    animation: shockPulse 3.8s ease-out infinite;
  }
  @keyframes shockPulse {
    0%, 31.8% { opacity: 0; transform: scale(0.1); }
    32.5% { opacity: 0.9; transform: scale(0.8); stroke-width: 3; }
    37% { opacity: 0; transform: scale(2.2); stroke-width: 0.5; }
    44% { opacity: 0.6; transform: scale(0.6); stroke-width: 2; }
    48% { opacity: 0; transform: scale(1.6); stroke-width: 0.5; }
    52%, 100% { opacity: 0; }
  }

  /* Ground Floor Shadow */
  .floor-shadow {
    fill: rgba(2, 18, 14, 0.65);
    transform-origin: 96px 228px;
    animation: shadowDynamic 3.8s cubic-bezier(0.1, 0, 0.2, 1) infinite;
  }
  @keyframes shadowDynamic {
    0%, 14% { transform: scale(1, 1); opacity: 0.25; }
    31.5% { transform: scale(1.4, 1.2); opacity: 0.7; }
    37% { transform: scale(0.6, 0.5); opacity: 0.2; }
    44.5% { transform: scale(1.2, 1.1); opacity: 0.6; }
    49% { transform: scale(0.8, 0.7); opacity: 0.3; }
    58%, 85% { transform: scale(1.3, 1.15); opacity: 0.8; }
    100% { transform: scale(1, 1); opacity: 0.25; }
  }

  /* Flying Ceramic Chunks */
  .chunk {
    transform-origin: center;
    transform-box: fill-box;
    opacity: 0;
    animation: chunkEject 3.8s cubic-bezier(0.15, 0.85, 0.25, 1) infinite;
  }
  @keyframes chunkEject {
    0%, 14.5% { opacity: 0; transform: translate(0, 0) scale(0.3); }
    16% { opacity: 1; transform: translate(calc(var(--cx) * 0.4px), calc(var(--cy) * 0.4px)) rotate(45deg); }
    28% { opacity: 1; transform: translate(calc(var(--cx) * 1px), calc(var(--cy) * 1px + 12px)) rotate(var(--crot)); }
    40%, 85% { opacity: 0.85; transform: translate(calc(var(--cx) * 1.1px), calc(var(--cy) * 1px + 22px)) rotate(var(--crot)); }
    92%, 100% { opacity: 0; transform: translate(0, 0); }
  }

  /* Interactive HUD */
  .hud-panel {
    position: absolute; bottom: 8px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(14, 20, 19, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(72, 254, 189, 0.2);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    color: var(--mint);
    z-index: 10;
  }
  .hud-btn {
    appearance: none; border: 1px solid rgba(72, 254, 189, 0.35);
    background: rgba(72, 254, 189, 0.12);
    color: #fff; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hud-btn:hover {
    background: var(--teal);
    color: #08110e;
    box-shadow: 0 0 10px rgba(72, 254, 189, 0.5);
  }
  .hud-tag {
    opacity: 0.75;
    font-size: 10.5px;
    direction: ltr;
  }
</style>
</head>

<div class="stage-box" id="stageBox">
  <svg id="svgRoot" xmlns="http://www.w3.org/2000/svg" viewBox="-25 0 230 250" fill="none">

      </g>

      <!-- ===== RIGHT HALF OF POT (with recoil kickback) ===== -->

      <polygon class="chunk" style="--cx: 60; --cy: -32; --crot: 310deg;" points="96,150 102,147 99,155" fill="#48FEBD" />

      <!-- ===== 3D COIN WITH GRAVITY TUMBLE & 2 BOUNCES ===== -->

        <path fill="url(#coinGrad)" d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z" />

  <!-- Interactive Telemetry HUD -->

    <button class="hud-btn" id="btnSlow">⏱️ حركة بطيئة</button>
    <span class="hud-tag">gravity drop · 2 bounces · 3D roll</span>
  </div>
</div>

<script>
  const stageBox = document.getElementById('stageBox');
  const svgRoot = document.getElementById('svgRoot');
  const coinRig = document.getElementById('coinRig');
  const halfLeft = document.getElementById('halfLeft');
  const halfRight = document.getElementById('halfRight');
  const cameraRig = document.getElementById('cameraRig');
  const btnShatter = document.getElementById('btnShatter');
  const btnSlow = document.getElementById('btnSlow');

  let isSlow = false;

  // Interactive 3D Camera Tilt
  stageBox.addEventListener('mousemove', (e) => {
    const rect = stageBox.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    svgRoot.style.transform = `rotateY(${x * 24}deg) rotateX(${-y * 24}deg)`;
  });
  stageBox.addEventListener('mouseleave', () => {
    svgRoot.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });

  // Slow Motion Toggle
  btnSlow.addEventListener('click', (e) => {
    e.stopPropagation();
    isSlow = !isSlow;
    const dur = isSlow ? '10s' : '3.8s';
    halfLeft.style.animationDuration = dur;
    halfRight.style.animationDuration = dur;
    coinRig.style.animationDuration = dur;
    cameraRig.style.animationDuration = dur;
    btnSlow.textContent = isSlow ? '⚡ سرعة عادية' : '⏱️ حركة بطيئة';
  });

  // Instant Shatter Trigger
  function triggerInstantShatter() {
    // Reset animation phase immediately by re-triggering class
    halfLeft.style.animation = 'none';
    halfRight.style.animation = 'none';
    coinRig.style.animation = 'none';
    cameraRig.style.animation = 'none';
    void halfLeft.offsetWidth; // force reflow
    const dur = isSlow ? '10s' : '3.8s';
    halfLeft.style.animation = `leftRecoil ${dur} cubic-bezier(0.2, 0.8, 0.2, 1) infinite`;
    halfRight.style.animation = `rightRecoil ${dur} cubic-bezier(0.2, 0.8, 0.2, 1) infinite`;
    coinRig.style.animation = `coinGravityDrop ${dur} cubic-bezier(0.1, 0, 0.2, 1) infinite`;
    cameraRig.style.animation = `camShake ${dur} linear infinite`;
  }

  btnShatter.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerInstantShatter();
  });
  stageBox.addEventListener('click', triggerInstantShatter);
</script>
</body>
</html>
