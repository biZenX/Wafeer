<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 195 245" width="100%" height="100%" fill="none">
<defs>
  <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#AFF5A7" />
    <stop offset="100%" stop-color="#48FEBD" />
  </linearGradient>
  <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5AC17A" />
    <stop offset="100%" stop-color="#388E3C" />
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>
<style>
  .wafeer-pot { fill: url(#potGrad); filter: drop-shadow(0 0 6px rgba(72, 254, 189, 0.4)); }
  .wafeer-coin-stroke { fill: #48FEBD; }
  .wafeer-coin-fill { fill: url(#coinGrad); }
  
  /* 3D Coin Physics: Wobble and sad drop — 1.8s×2 = 3.6s ⇒ يتزامن مع دورة الحلقة */
  .coin-3d {
    transform-origin: 96px 40px;
    animation: coinWobble3D 1.8s ease-in-out infinite alternate;
  }
  @keyframes coinWobble3D {
    0% { transform: perspective(400px) rotateY(0deg) rotateZ(0deg) translateY(0); }
    30% { transform: perspective(400px) rotateY(45deg) rotateZ(-6deg) translateY(-2px); }
    70% { transform: perspective(400px) rotateY(-40deg) rotateZ(8deg) translateY(3px); }
    100% { transform: perspective(400px) rotateY(15deg) rotateZ(-3deg) translateY(1px); }
  }

  /* Rapid Realistic Flies & Moths */
  .moth-wing-l {
    transform-origin: 100% 50%;
    animation: flapL 0.05s infinite alternate linear;
  }
  .moth-wing-r {
    transform-origin: 0% 50%;
    animation: flapR 0.05s infinite alternate linear;
  }
  @keyframes flapL { from { transform: rotate(50deg) scaleX(0.7); } to { transform: rotate(-35deg) scaleX(1); } }
  @keyframes flapR { from { transform: rotate(-50deg) scaleX(0.7); } to { transform: rotate(35deg) scaleX(1); } }

  /* مدد تقسم 3.6s ⇒ الحلقة تتكرّر بلا قفزة (1.2 / 1.8 / 0.9) */
  .fly-erratic-1 { animation: flyPath1 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  .fly-erratic-2 { animation: flyPath2 1.8s cubic-bezier(0.3, 0.2, 0.5, 0.9) infinite; }
  .fly-erratic-3 { animation: flyPath3 0.9s ease-in-out infinite; }

  @keyframes flyPath1 {
    0% { transform: translate(65px, 110px) scale(0.2); opacity: 0; }
    15% { transform: translate(50px, 80px) scale(0.9); opacity: 1; }
    40% { transform: translate(110px, 45px) scale(1.1); opacity: 1; }
    65% { transform: translate(35px, 30px) scale(0.85); opacity: 1; }
    85% { transform: translate(80px, 85px) scale(0.7); opacity: 1; }
    100% { transform: translate(65px, 110px) scale(0.2); opacity: 0; }
  }
  @keyframes flyPath2 {
    0% { transform: translate(105px, 110px) scale(0.2); opacity: 0; }
    20% { transform: translate(125px, 70px) scale(1); opacity: 1; }
    50% { transform: translate(70px, 20px) scale(0.9); opacity: 1; }
    75% { transform: translate(130px, 50px) scale(1.1); opacity: 1; }
    90% { transform: translate(100px, 90px) scale(0.6); opacity: 1; }
    100% { transform: translate(105px, 110px) scale(0.2); opacity: 0; }
  }
  @keyframes flyPath3 {
    0% { transform: translate(85px, 105px) scale(0.2); opacity: 0; }
    25% { transform: translate(40px, 60px) scale(1); opacity: 1; }
    60% { transform: translate(95px, 65px) scale(0.8); opacity: 1; }
    80% { transform: translate(60px, 40px) scale(1); opacity: 1; }
    100% { transform: translate(85px, 105px) scale(0.2); opacity: 0; }
  }
</style>

<g id="wafeer-symbol">
  <!-- 3D Flipping Coin -->
  <g class="coin-3d">
    <path class="wafeer-coin-fill" d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z" />
    <path class="wafeer-coin-stroke" fill-rule="evenodd" d="M 81.332,6.497 C 72.794,10.688 69.577,14.206 67.383,21.756 C 61.007,43.687 81.417,78.842 100.603,78.978 C 105.216,79.011 116.925,74.446 120.147,71.359 C 131.894,60.105 126.835,29.23 110.529,12.661 C 100.605,2.577 92.714,0.911 81.332,6.497 M 83.09,12.265 C 71.748,18.079 75.084,46.867 88.877,62.209 C 108.236,83.74 126.491,63.317 114.426,33.625 C 107.591,16.806 93.273,7.045 83.09,12.265" />
  </g>
  <!-- Main Pot Body -->
  <path class="wafeer-pot" fill-rule="evenodd" d="M 56.5,79.715 C 27.539,83.72 13.425,100.025 26.262,114.646 C 29.892,118.78 29.225,121.152 22.131,129.349 C -2.127,157.377 -3.641,194.866 18.566,217.611 C 21.555,220.673 24,223.304 24,223.459 C 24,223.613 21.188,224.293 17.75,224.969 C 9.958,226.501 8,227.529 8,230.086 C 8,239.466 91.486,242.125 127.5,233.892 C 152.705,228.129 167.929,214.123 172.489,192.5 C 177.102,170.628 170.017,147.544 152.756,128.199 C 146.179,120.828 144.356,116.779 146.728,114.811 C 151.39,110.946 152.288,101.36 148.51,95.8 C 143.653,88.652 121.438,81.133 117.327,85.245 C 114.791,87.781 116.876,89.414 126.472,92.406 C 143.39,97.681 146.132,105.895 133.164,112.453 C 119.319,119.455 62.629,120.024 42.139,113.366 C 21.299,106.595 30.54,91.901 58.5,87.353 C 69.511,85.562 72,84.599 72,82.128 C 72,79.128 66.703,78.304 56.5,79.715 M 72.978,91.113 C 55.999,92.482 45.764,96.615 47.586,101.365 C 50.657,109.366 107.039,111.719 121.128,104.434 C 135.618,96.941 105.168,88.517 72.978,91.113 M 36.944,125.135 C 36.206,126.916 33.531,130.877 30.999,133.937 C 28.467,136.997 25.043,141.525 23.39,144 C 3.864,173.243 13.254,212.289 42.298,222.617 C 67.567,231.602 121.034,230.186 140.997,220.002 C 168.539,205.951 170.47,163.878 144.913,134.648 C 141.65,130.915 138.274,126.497 137.412,124.829 C 136.208,122.501 135.339,121.915 133.672,122.305 C 116.431,126.343 93.813,128.339 75.671,127.425 C 65.287,126.902 43.553,123.917 39.889,122.511 C 38.74,122.07 37.905,122.814 36.944,125.135 M 131.667,144.667 C 130.059,146.275 131.273,150.136 134.651,154.155 C 138.701,158.975 142.354,166.526 143.402,172.242 C 144.215,176.68 148.007,178.421 150.792,175.636 C 154.204,172.225 148.362,155.619 141.046,147.928 C 137.543,144.245 133.495,142.838 131.667,144.667 M 66.2,163.2 C 61.444,167.956 70.499,177 80.018,177 C 89.032,177 97.48,167.88 92.8,163.2 C 91.004,161.404 90.428,161.646 86.117,166 C 80.621,171.551 75.695,171.179 72.485,164.97 C 70.886,161.879 68.261,161.139 66.2,163.2" />
</g>

<!-- High-Speed Realistic Flies -->
<g class="fly-erratic-1">
  <ellipse class="moth-wing-l" cx="-3.5" cy="-1" rx="3.5" ry="2.4" fill="#AFF5A7" opacity="0.7" />
  <ellipse class="moth-wing-r" cx="3.5" cy="-1" rx="3.5" ry="2.4" fill="#AFF5A7" opacity="0.7" />
  <circle cx="0" cy="0" r="2.2" fill="#080C0B" stroke="#48FEBD" stroke-width="0.8" />
</g>
<g class="fly-erratic-2">
  <ellipse class="moth-wing-l" cx="-3.5" cy="-1" rx="3.5" ry="2.4" fill="#AFF5A7" opacity="0.7" />
  <ellipse class="moth-wing-r" cx="3.5" cy="-1" rx="3.5" ry="2.4" fill="#AFF5A7" opacity="0.7" />
  <circle cx="0" cy="0" r="2" fill="#080C0B" stroke="#48FEBD" stroke-width="0.8" />
</g>
<g class="fly-erratic-3">
  <ellipse class="moth-wing-l" cx="-3" cy="-0.8" rx="3" ry="2" fill="#AFF5A7" opacity="0.7" />
  <ellipse class="moth-wing-r" cx="3" cy="-0.8" rx="3" ry="2" fill="#AFF5A7" opacity="0.7" />
  <circle cx="0" cy="0" r="1.8" fill="#080C0B" stroke="#48FEBD" stroke-width="0.8" />
</g>
</svg>