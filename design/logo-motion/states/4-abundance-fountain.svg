<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 195 245" style="overflow:visible" fill="none">
<!-- ═══════════════════════════════════════════════════════════════════════
     وفير — الحالة 4: الوفرة والتوفير العالي — «نافورة خير» ✨
     ─────────────────────────────────────────────────────────────────────
     نافورة من نافذتين على حافتي فم الوعاء (يسار 54,97 · يمين 126,97)
     حتى لا تمرّ العملات فوق العملة الأم centrally.
     12 عملة (نسخ مصغّرة من العملة الرسمية · 26%) في 3 طبقات عمق:
       --z = مقياس العمق (0.68 بعيد · 0.85 متوسط · 1.05–1.18 قريب)
       --x = المدى الأفقي عند الهبوط (u) · --h = ارتفاع القمة (u)
       --fade = نصيب الاختفاء قبل الهبوط (0.05 ترجع للوعاء · 0.95 تتناثر)
     فيزياء القوس parabola حقيقية:  x(t) = X·t ,  y(t) = −H·4t(1−t)
     ⇒ القمة عند t = 0.5 بالضبط والعودة بنفس التماثل (صعود بطيء · هبوط أسرع).
     العمق الحقيقي: perspective(200px) + rotateY(360deg) كل 0.45s.
     اللون: #48FEBD + تدرّج العملة الرسمي — البريق official.
     ═══════════════════════════════════════════════════════════════════════ -->
<defs>
  <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5AC17A"/>
    <stop offset="100%" stop-color="#388E3C"/>
  </linearGradient>
  <!-- تدرّج أبسط للعملات الصغيرة: ألمع قليلاً فتلمع (gleam) -->
  <linearGradient id="fcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#EAFFF6"/>
    <stop offset="45%" stop-color="#7BFFC4"/>
    <stop offset="100%" stop-color="#48FEBD"/>
  </linearGradient>
  <radialGradient id="aura">
    <stop offset="0%"  stop-color="#48FEBD" stop-opacity=".34"/>
    <stop offset="55%" stop-color="#48FEBD" stop-opacity=".11"/>
    <stop offset="100%" stop-color="#48FEBD" stop-opacity="0"/>
  </radialGradient>
  <!-- رمز العملة المصغّرة: نفس المسارات الرسمية بنسبة 26% -->
  <g id="fc">
    <g transform="scale(.26) translate(-96,-40)">
      <path fill="url(#fcGrad)" d="M 86.433,15.71 C 82.264,19.879 81.008,27.739 83.032,37 C 84.043,41.623 87.712,50.549 89.497,52.723 C 90.048,53.395 91.85,55.697 93.5,57.837 C 96.83,62.156 101.52,65.591 105.428,66.571 C 107.478,67.086 108.59,66.58 110.944,64.06 C 118.492,55.98 115.06,36.312 103.729,22.703 C 97.433,15.141 90.005,12.138 86.433,15.71 Z"/>
      <path class="wafeer-coin-stroke" fill-rule="evenodd" d="M 81.332,6.497 C 72.794,10.688 69.577,14.206 67.383,21.756 C 61.007,43.687 81.417,78.842 100.603,78.978 C 105.216,79.011 116.925,74.446 120.147,71.359 C 131.894,60.105 126.835,29.23 110.529,12.661 C 100.605,2.577 92.714,0.911 81.332,6.497 M 83.09,12.265 C 71.748,18.079 75.084,46.867 88.877,62.209 C 108.236,83.74 126.491,63.317 114.426,33.625 C 107.591,16.806 93.273,7.045 83.09,12.265"/>
    </g>
  </g>
</defs>

<style>
  .wafeer-coin-fill   { fill: url(#coinGrad); }
  .wafeer-coin-stroke { fill: #48FEBD; }
  .wafeer-pot         { fill: #48FEBD; }
  .wafeer-sparkles    { fill: #48FEBD; }

  /* ══════════ هالة الوفرة — تنبض خلف الشعار ══════════ */
  .aura{
    transform-box: view-box; transform-origin:90px 130px;
    animation: auraPulse 1.2s ease-in-out infinite;
  }
  @keyframes auraPulse{
    0%,100% { opacity:.32; transform: scale(.92); }
    50%     { opacity:.85; transform: scale(1.07); }
  }

  /* ══════════ توهج عام على الشعار كله ══════════ */
  .glow{
    transform-box: view-box; transform-origin:88px 120px;
    animation: glowPulse 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 5px rgba(72,254,189,.35)) drop-shadow(0 0 18px rgba(72,254,189,.2));
  }
  @keyframes glowPulse{
    0%,100% { transform: scale(1);
              filter: drop-shadow(0 0 5px rgba(72,254,189,.35)) drop-shadow(0 0 18px rgba(72,254,189,.2)); }
    50%     { transform: scale(1.015);
              filter: drop-shadow(0 0 10px rgba(72,254,189,.6)) drop-shadow(0 0 34px rgba(72,254,189,.35)); }
  }

  /* ══════════ البريق الرسمي — ينطّ بفرح ══════════ */
  .sparkles{
    transform-box: view-box; transform-origin:96px 26px;
    animation: sparkJoy .9s ease-in-out infinite;
  }
  @keyframes sparkJoy{
    0%,100% { opacity:.55; transform: scale(.9) rotate(-3deg); }
    50%     { opacity:1;   transform: scale(1.12) rotate(3deg); }
  }

  /* ══════════ الوعاء — زفرة الخزنة المليانة ══════════ */
  .pot{
    transform-box: view-box; transform-origin:88px 236px;
    animation: potJoy 1.2s ease-in-out infinite;
  }
  @keyframes potJoy{
    0%,100% { transform: translateY(0) scaleY(1); }
    40%     { transform: translateY(-2.4px) scaleY(1.014); }
    70%     { transform: translateY(0) scaleY(1); }
  }

  /* ══════════ العملة الأم — ترقص بفرح مع ميل 3D خفيف ══════════ */
  .coin{
    transform-box: view-box; transform-origin:96px 40px;
    animation: coinDance 1.2s ease-in-out infinite;
  }
  @keyframes coinDance{
    0%,100% { transform: perspective(240px) rotateY(0deg) translateY(0) rotate(0deg); }
    25%     { transform: perspective(240px) rotateY(-11deg) translateY(-2px) rotate(-3deg); }
    60%     { transform: perspective(240px) rotateY(9deg) translateY(.6px) rotate(2.5deg); }
  }

  /* ══════════ نافورة العملات ══════════
     القوس: translate فقط (موضع النقطة) · المقياس: حسب العمق --z */
  .fcoin{
    transform-box: fill-box; transform-origin: 50% 50%;
    animation: fountain .9s cubic-bezier(.25,.45,.55,1) infinite;
    opacity:0;
  }
  @keyframes fountain{
    0%   { transform: translate(0,0) scale(calc(var(--z) * .22)) rotate(0deg); opacity:0 }
    7%   { transform: translate(calc(var(--x) * .07px), calc(var(--h) * -.28px)) scale(calc(var(--z) * .95)) rotate(25deg); opacity:1 }
    25%  { transform: translate(calc(var(--x) * .25px), calc(var(--h) * -.75px)) scale(calc(var(--z) * 1)) rotate(95deg); opacity:1 }
    50%  { transform: translate(calc(var(--x) * .5px), calc(var(--h) * -1px)) scale(calc(var(--z) * .96)) rotate(180deg); opacity:1 }  /* القمة */
    75%  { transform: translate(calc(var(--x) * .75px), calc(var(--h) * -.75px)) scale(calc(var(--z) * .86)) rotate(265deg); opacity:calc(1 - var(--fade) * .35) }
    100% { transform: translate(calc(var(--x) * 1px), 0px) scale(calc(var(--z) * .42)) rotate(360deg); opacity:calc(1 - var(--fade)) }
  }
  /* الدوران الحقيقي على محور Y داخل فضاء ثلاثي الأبعاد */
  .fcoin-3d{
    transform-box: fill-box; transform-origin: 50% 50%;
    perspective: 200px; perspective-origin: 50% 50%;
    animation: coinSpin .45s linear infinite;
  }
  @keyframes coinSpin{
    0%   { transform: rotateY(0deg); }
    25%  { transform: rotateY(90deg); }    /* حافة */
    50%  { transform: rotateY(180deg); }   /* الظهر */
    75%  { transform: rotateY(270deg); }   /* حافة */
    100% { transform: rotateY(360deg); }
  }
  /* بريق خاطف عند القمم */
  .glint{
    fill:#EAFFF6; opacity:0;
    transform-box: fill-box; transform-origin: 50% 50%;
    animation: glint .9s ease-out infinite;
  }
  @keyframes glint{
    0%,42%   { opacity:0;   transform: scale(.2) rotate(0deg); }
    50%      { opacity:.95; transform: scale(1.1) rotate(35deg); }
    58%      { opacity:.35; transform: scale(.7) rotate(60deg); }
    72%,100% { opacity:0;   transform: scale(.2) rotate(90deg); }
  }
  /* ومضات صغيرة حول الرأس */
  .twinkle{ fill:#AFF5A7; animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100% { opacity:0 }
    50%     { opacity:.75 }
  }
</style>

<!-- ═══ هالة الوفرة خلف كل شيء ═══ -->
<ellipse class="aura" cx="90" cy="130" rx="96" ry="112" fill="url(#aura)"/>

